<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body><pre id="out" style="color:lime;background:#111;padding:20px;font-size:14px;">Checking...</pre>
<script>
fetch('taiwan-us-risk-assessment.html')
  .then(r => r.text())
  .then(html => {
    const m = html.match(/<script>([\s\S]*?)<\/script>/);
    if (!m) { document.getElementById('out').textContent = 'No script found'; return; }
    try {
      new Function(m[1]);
      document.getElementById('out').textContent = 'JS syntax OK';
    } catch(e) {
      document.getElementById('out').textContent = 'SYNTAX ERROR:\n' + e.message + '\n\n' + e.stack;
    }
  });
</script></body></html>
